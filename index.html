<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>Today's Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F12; --panel:#131A20; --line:#232E37;
    --ink:#F2F5F3; --mute:#7A8590; --amber:#FFB020; --left:#5EC8D8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Barlow',system-ui,sans-serif;
    position:relative;
  }
  #stage{position:absolute;left:0;top:0}

  /* Fixed design canvas — scaled by JS to fit any screen. */
  #stage{
    width:1600px;
    flex:none;
    padding:23px 34px 26px;
    border-top:3px solid var(--amber);
    display:flex;flex-direction:column;
  }

  /* ---- header ---- */
  header{
    display:flex;align-items:baseline;gap:22px;flex-wrap:nowrap;
    padding-bottom:16px;border-bottom:2px solid var(--line);
  }
  .day{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:76px;line-height:.9;letter-spacing:-.01em;text-transform:uppercase;
    flex:0 0 auto;
  }
  .session{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;
    font-size:36px;color:var(--amber);text-transform:uppercase;letter-spacing:.02em;
    flex:1 1 auto;min-width:0;line-height:1.1;
  }
  .week{
    font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;
    letter-spacing:.1em;color:var(--mute);border:1px solid var(--line);
    border-radius:3px;padding:6px 14px;white-space:nowrap;flex:0 0 auto;
  }
  .week.dl{color:var(--bg);background:var(--amber);border-color:var(--amber)}
  .navbar{display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .navbar button{
    appearance:none;background:var(--panel);border:1px solid var(--line);border-radius:3px;
    color:#C9D3DA;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;
    letter-spacing:.06em;padding:8px 18px;cursor:pointer;white-space:nowrap;
  }
  .navbar button:focus{outline:none;background:var(--amber);border-color:var(--amber);color:var(--bg)}
  /* wall clock: fixed width (8 digit cells) so the layout never moves as it ticks */
  .clock{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:62px;line-height:.9;
    color:var(--ink);white-space:nowrap;flex:0 0 auto;letter-spacing:-.02em}
  .clock .t{display:inline-block;width:8ch;text-align:right}
  .clock i{font-style:normal;color:var(--mute)}
  .clock .s{color:var(--amber)}
  .clock .ap{font-size:22px;letter-spacing:.06em;color:var(--mute);margin-left:8px}

  .dlbar{background:var(--amber);color:var(--bg);font-weight:600;font-size:19px;
    padding:11px 0;line-height:1.35;text-align:center}

  /* ---- body columns ---- */
  .cols{display:flex;gap:30px;padding-top:18px;align-items:flex-start;flex:1 1 auto}
  .rail{flex:0 0 var(--rw,470px);background:var(--panel);border:1px solid var(--line);
    border-radius:4px;padding:22px 24px}
  main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-self:stretch}

  .block{margin-bottom:26px}
  .block:last-child{margin-bottom:0}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--mute);margin-bottom:11px}
  .rail ol{list-style:none;counter-reset:step}
  .rail li{counter-increment:step;position:relative;padding-left:34px;
    margin-bottom:10px;font-size:24px;line-height:1.3}
  .rail li::before{content:counter(step);position:absolute;left:0;top:2px;
    font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--mute)}
  .rail li b{font-weight:600}
  .flow{font-size:24px;line-height:1.4;color:#C9D3DA}
  .flow em{font-style:normal;color:var(--ink);font-weight:600}
  .L{color:var(--left);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;
    letter-spacing:.08em;border:1px solid var(--left);border-radius:2px;
    padding:1px 5px;margin-left:6px;white-space:nowrap;vertical-align:2px}

  .sechead{display:flex;justify-content:space-between;align-items:baseline;
    gap:20px;margin:18px 0 2px;
    font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--mute)}
  .sec:first-of-type .sechead{margin-top:8px}
  .sechead .meta{font-size:20px;letter-spacing:.03em;text-transform:none;color:#B9C4CC;text-align:right}
  .sec.circuit{position:relative;margin-top:4px}
  .sec.circuit::before{content:'';position:absolute;left:-17px;top:0;bottom:0;width:4px;background:var(--amber)}
  .sec.circuit .sechead{color:var(--amber)}

  /* ---- table ---- */
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  thead th{font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--mute);font-weight:500;text-align:left;
    padding-bottom:11px;border-bottom:1px solid var(--line)}
  thead th.n{text-align:center}
  tbody td{padding:13px 0;border-bottom:1px solid var(--line);vertical-align:middle}
  .move{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:34px;
    line-height:1.06;padding-right:14px}
  .reps{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:28px;
    text-align:center;line-height:1.15}
  td.n{text-align:center}
  .rpe{font-family:'IBM Plex Mono',monospace;font-size:27px;color:#E6ECF0}
  .rest{font-family:'IBM Plex Mono',monospace;font-size:24px;color:#B9C4CC;
    text-align:right;white-space:nowrap}

  /* how-to pictures (howto/<id>.svg), sized per day by render() */
  td.thumb{padding:2px 14px 2px 0}
  td.thumb img{display:block;width:100%;height:var(--th,56px);object-fit:contain;object-position:left center}

  /* hip block pictures: numbered strip under the heading, matching the list */
  .hipstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:2px 0 16px}
  .hipstrip figure{margin:0;position:relative;padding-left:14px;min-width:0}
  .hipstrip figure span{position:absolute;left:0;top:-2px;font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--mute)}
  .hipstrip img{display:block;width:100%;height:var(--hh,56px);object-fit:contain;object-position:center bottom}

  /* tempo readout */
  .tempo{display:inline-flex;gap:3px}
  .tempo span{width:30px;height:36px;display:flex;align-items:center;justify-content:center;
    background:#0E1418;border:1px solid var(--line);border-radius:2px;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;color:var(--ink)}
  .tempo span.x{color:var(--amber);border-color:var(--amber)}
  .tempo span.z{color:#3E4A54}
  .tempo.hold{font-family:'IBM Plex Mono',monospace;font-size:23px;color:#B9C4CC;letter-spacing:.04em}
  .thead-tempo{display:inline-flex;gap:3px}
  .thead-tempo span{width:30px;display:block;text-align:center;font-size:11px;color:#7A8590;letter-spacing:0}

  .legend{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;font-size:18px;color:#8A96A1;letter-spacing:.03em}

  .cardio{display:flex;flex-direction:column;justify-content:center;gap:24px;padding:40px 0;flex:1 1 auto}
  .big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:104px;
    line-height:.94;letter-spacing:-.015em}
  .big em{font-style:normal;color:var(--amber)}
  .sub{font-size:29px;color:#D5DDE3;line-height:1.45}

  .notes{border-top:2px solid var(--line);margin-top:20px;padding-top:16px;
    display:flex;gap:34px;font-size:23px;color:#D5DDE3;line-height:1.35}
  .notes p{flex:1;border-left:3px solid var(--line);padding-left:14px}
  .notes strong{color:var(--amber);font-weight:600}
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---- Live data source: Supabase ----
// The program comes from get_gym_display(k), which only answers with the right
// key. The key is never in this repo: it rides in the TV's start URL (?k=...)
// and is remembered on the device after the first load.
var BUILD = "2026101201";
var SB_URL = "https://jzwtdzftxbaicdothear.supabase.co";
var SB_KEY = "sb_publishable_0xl6KnixnFi0Z2YKU91Sqg_Nbj5_14L";
var KEY = readKey();

var ME = null;
var cur = new Date().getDay();

function readKey(){
  var k = new URLSearchParams(location.search).get("k") || "";
  try {
    if(k) localStorage.setItem("gymKey", k);
    else k = localStorage.getItem("gymKey") || "";
  } catch(e) {}
  return k;
}

var REST_DAY = {
  day:"Rest", session:"Nothing scheduled", hip:false,
  cardio:{ big:"Rest day", sub:"Nothing programmed for today." },
  notes:["<strong>Nothing to do here.</strong> Press \u25c0 or \u25b6 to look at another day."]
};

function weekInfo(person){
  if(!person.blockStart) return {n:0, deload:false};
  var p = person.blockStart.split("-");
  var a = new Date(+p[0], +p[1]-1, +p[2]);
  var now = new Date();
  var b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dow = (b.getDay() + 6) % 7;
  b.setDate(b.getDate() - dow);
  var n = Math.floor((b - a) / 604800000) + 1;
  return { n: n, deload: n > 0 && n % 4 === 0 };
}

function tempoCell(t){
  if(!/^[0-9X]{4}$/.test(t)) return '<span class="tempo hold">'+t+'</span>';
  var cells = t.split("").map(function(c){
    var cls = c==="X" ? "x" : (c==="0" ? "z" : "");
    return '<span class="'+cls+'">'+c+'</span>';
  }).join("");
  return '<div class="tempo">'+cells+'</div>';
}

// Wall clock from the device's own time, so the Stick has to be on local time.
function clockHtml(){
  var n = new Date(), h = n.getHours() % 12 || 12;
  function two(x){ return (x < 10 ? "0" : "") + x; }
  return '<span class="t">'+h+'<i>:</i>'+two(n.getMinutes())+'<i>:</i><span class="s">'+two(n.getSeconds())+'</span></span>'+
    '<span class="ap">'+(n.getHours() < 12 ? "AM" : "PM")+'</span>';
}

function render(idx, refocus){
  var stage = document.getElementById("stage");
  if(!ME){ return; }
  var person = ME;
  var d = person.program[String(idx)] || REST_DAY;
  var stamp = new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"});
  var wk = weekInfo(person);

  // The hip block is always written out in full; with pictures, a numbered
  // strip of them sits under the heading, matching the list below it.
  var hipPics = !!(d.hip && person.hipBlock && person.hipBlock.length && person.hipDiagrams && person.hipDiagrams.length);
  function railHtml(strip){
    var r = "";
    if(d.hip && person.hipBlock && person.hipBlock.length){
      r += '<div class="block"><div class="eyebrow">Hip block \u2014 first</div>' +
        (strip ? '<div class="hipstrip">' + person.hipDiagrams.map(function(id, n){
          return '<figure><span>'+(n+1)+'</span><img src="howto/'+id+'.svg?b='+BUILD+'" alt=""></figure>';
        }).join("") + '</div>' : '') + '<ol>' +
        person.hipBlock.map(function(h){ return '<li>'+h+'</li>'; }).join("") + '</ol></div>';
    }
    if(d.warm && person.warm && person.warm[d.warm]){
      r += '<div class="block"><div class="eyebrow">Warm-up '+d.warm+'</div><div class="flow">'+person.warm[d.warm]+'</div></div>';
    }
    return r || '<div class="eyebrow">No warm-up prescribed</div>';
  }

  var dg = person.diagrams || {};
  var allRows = d.cardio ? [] : (d.sections || [{rows: d.rows || []}]).reduce(function(a, s){ return a.concat(s.rows); }, []);
  var thumbs = allRows.some(function(r){ return dg[r[0]]; });

  // t = width (%) of the how-to picture column; 0 = no pictures that day.
  function mainHtml(t){
    if(d.cardio){
      return '<div class="cardio"><div class="big">'+d.cardio.big+'</div><div class="sub">'+d.cardio.sub+'</div></div>';
    }
    // With pictures, tempo/RPE/rest keep fixed widths (tempo boxes need 13%, and
    // rest keeps its full 17% so "90s after round" never runs off the screen).
    // Movement keeps its 35% at the smallest pictures so names don't wrap more;
    // larger pictures borrow from movement and sets (and only stick if nothing shrinks).
    var mv = Math.min(35, 35 - (t - 10) * 0.6);
    var widths = t ? [t, mv, 64 - t - mv, 13, 6, 17] : [35,24,15,9,17];
    var COLS = '<colgroup>' + widths.map(function(w){ return '<col style="width:'+w+'%">'; }).join("") + '</colgroup>';
    function rowsHtml(rows){
      return rows.map(function(r){
        var pic = t ? '<td class="thumb">' + (dg[r[0]] ? '<img src="howto/'+dg[r[0]]+'.svg?b='+BUILD+'" alt="">' : '') + '</td>' : '';
        return '<tr>'+pic+'<td class="move">'+r[0]+(r[5]?'<span class="L">LEFT FIRST</span>':'')+'</td>'+
          '<td class="reps">'+r[1]+'</td>'+
          '<td class="n">'+tempoCell(r[2])+'</td>'+
          '<td class="n rpe">'+r[3]+'</td>'+
          '<td class="rest">'+r[4]+'</td></tr>';
      }).join("");
    }
    var head = '<table>'+COLS+'<thead><tr>'+(t ? '<th></th>' : '')+
      '<th>Movement</th><th style="text-align:center">Sets \u00d7 reps</th>'+
      '<th class="n"><div class="thead-tempo"><span>DOWN</span><span>HOLD</span><span>UP</span><span>HOLD</span></div></th>'+
      '<th class="n">RPE</th><th style="text-align:right">Rest</th>'+
      '</tr></thead></table>';
    var secs = (d.sections || [{rows: d.rows || []}]).map(function(sec){
      var hd = "";
      if(sec.title || sec.meta){
        hd = '<div class="sechead"><span>'+(sec.title||"")+'</span>'+
             (sec.meta ? '<span class="meta">'+sec.meta+'</span>' : '')+'</div>';
      }
      return '<div class="sec'+(sec.circuit?' circuit':'')+'">'+hd+
        '<table>'+COLS+'<tbody>'+rowsHtml(sec.rows)+'</tbody></table></div>';
    }).join("");
    return head + secs +
      '<div class="legend">Each digit = seconds &nbsp;\u00b7&nbsp; <b style="color:var(--amber)">X</b> = explosive, move it fast &nbsp;\u00b7&nbsp; <b style="color:#3E4A54">0</b> = no pause &nbsp;\u00b7&nbsp; <b style="color:var(--amber)">\u2503</b> circuit block: cycle it, don\u2019t finish one lift first</div>';
  }

  var weekBadge = wk.n > 0
    ? '<div class="week'+(wk.deload?' dl':'')+'">WEEK '+wk.n+(wk.deload?' \u00b7 DELOAD':'')+'</div>'
    : "";

  function page(t, strip){ return '' +
    '<header><div class="day">'+d.day+'</div><div class="session">'+d.session+'</div>'+
    weekBadge +
    '<div class="navbar"><button data-d="prev">\u25c0</button>'+
    '<button data-d="today">TODAY \u00b7 '+stamp+'</button>'+
    '<button data-d="next">\u25b6</button>'+
    '<button data-d="fs">\u26f6</button></div>' +
    '<div class="clock" id="clock">'+clockHtml()+'</div></header>' +
    (wk.deload ? '<div class="dlbar">' + (person.deloadInNumbers
      ? 'Deload week \u2014 already built into the numbers below. Do them as written.'
      : 'Deload week \u2014 cut working sets by about a third, hold RPE at 6. Keep tempos and balance work as written.') + '</div>' : '') +
    '<div class="cols"><div class="rail">'+railHtml(strip)+'</div><main>'+mainHtml(t)+'</main></div>' +
    '<div class="notes">'+d.notes.map(function(n){ return '<p>'+n+'</p>'; }).join("")+'</div>';
  }

  // Picture layout: t = table picture column %, th = its height, rw = rail
  // width, hh = hip strip height (0 = no strip). Measure the day without any
  // pictures, then (1) find the tallest hip strip that fits without lowering
  // the screen's scale, widening the rail into spare table width if that helps;
  // (2) grow the table pictures while the scale still holds. If no hip strip is
  // free, use the smallest one at the rail width that costs least. Choices are
  // cached per day and data, so the 60s refresh doesn't redo the search.
  function show(c){
    stage.style.setProperty("--th", c.th + "px");
    stage.style.setProperty("--hh", c.hh + "px");
    stage.style.setProperty("--rw", c.rw + "px");
    stage.innerHTML = page(c.t, c.hh > 0);
    fit();
    return parseFloat(stage.style.zoom) || 1;
  }
  var cache = render.cache || (render.cache = {});
  var key = [idx, window.innerWidth, window.innerHeight,
             JSON.stringify([d, person.hipBlock, person.hipDiagrams, person.warm, dg, wk])].join("|");
  var cfg = cache[key];
  if(!cfg){
    var base = show({t:0, th:0, rw:470, hh:0});
    var TH = thumbs ? [[10,56],[15,56],[19,84],[24,112],[30,150]] : [[0,0]];
    cfg = {t:TH[0][0], th:TH[0][1], rw:470, hh:0};
    var z = thumbs ? show(cfg) : base;
    if(hipPics){
      var pick = null, pz = -1;
      search:
      for(var a = 0; a < 4; a++){
        for(var b = 0; b < 4; b++){
          var c = {t:cfg.t, th:cfg.th, rw:[470,520,570,620][b], hh:[84,70,56,44][a]}, cz = show(c);
          if(cz >= base * 0.995){ pick = c; pz = cz; break search; }
          if(a === 3 && cz > pz){ pick = c; pz = cz; }
        }
      }
      cfg = pick; z = pz;
    }
    var limit = Math.min(base, z) * 0.995;
    for(var i = 1; i < TH.length; i++){
      var c2 = {t:TH[i][0], th:TH[i][1], rw:cfg.rw, hh:cfg.hh};
      if(show(c2) >= limit) cfg = c2;
    }
    // Only trust a layout measured with the real fonts; until then, search again.
    if(!document.fonts || document.fonts.status === "loaded") cache[key] = cfg;
  }
  show(cfg);
  if(refocus){
    var el = document.querySelector(refocus);
    if(el) el.focus();
  }
}

function showMessage(title, sub){
  document.getElementById("stage").innerHTML =
    '<div class="cardio"><div class="big">'+title+'</div><div class="sub">'+sub+'</div></div>';
  fit();
}

function fit(){
  var stage = document.getElementById("stage");
  var de = document.documentElement, vv = window.visualViewport;
  window.scrollTo(0, 0);
  // The visible window — size AND position — from the API built for exactly that.
  var vw = vv ? vv.width  : (de.clientWidth  || window.innerWidth);
  var vh = vv ? vv.height : (de.clientHeight || window.innerHeight);
  var ox = vv ? vv.offsetLeft : 0, oy = vv ? vv.offsetTop : 0;
  var aspect = vw / vh;

  // Lay out at the design width; widen (to 2100 max) if the content is taller
  // than the screen's shape; then settle the canvas to that exact shape.
  stage.style.zoom = "1";
  stage.style.minHeight = "0";
  stage.style.width = "1600px";
  var w = stage.offsetWidth, h = stage.offsetHeight;
  if (h * aspect > w) {
    w = Math.min(2100, Math.round(h * aspect));
    stage.style.width = w + "px";
    w = stage.offsetWidth; h = stage.offsetHeight;
  }
  stage.style.minHeight = Math.round(w / aspect) + "px";
  h = stage.offsetHeight;

  var safe = parseFloat(new URLSearchParams(location.search).get("safe")) || 0;
  var margin = 0.985 * (1 - safe / 100);
  var s = Math.min(vw / w, vh / h) * margin;
  stage.style.zoom = s;
  // Anchor the scaled canvas to the visible window's own origin and center it there.
  stage.style.left = Math.round((ox + (vw - w * s) / 2) / s) + "px";
  stage.style.top  = Math.round((oy + (vh - h * s) / 2) / s) + "px";

}

// Re-fit whenever the stage's natural size changes for any reason —
// font swap, late layout, content update. This is what guarantees
// nothing is ever cut off.
if (window.ResizeObserver) {
  var ro = new ResizeObserver(function(){ fit(); });
  ro.observe(document.getElementById("stage"));
}

function load(){
  var auth = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY };
  // Without a key, fall back to the old open read (empty once it's locked).
  var req = KEY
    ? fetch(SB_URL + "/rest/v1/rpc/get_gym_display", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, auth),
        body: JSON.stringify({ k: KEY })
      })
    : fetch(SB_URL + "/rest/v1/gym_display?select=person,sort,data&order=sort", { headers: auth });
  req
  .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function(rows){
    if(!rows.length){
      if(KEY) showMessage("Key not recognised", "Check the k= value at the end of the start URL.");
      else showMessage("This screen needs its key", "Add ?k= and your key to the end of the start URL.");
      return;
    }
    var row = rows[0];
    ME = {
      program: row.data.program || {},
      hipBlock: row.data.hip || null,
      hipDiagrams: row.data.hip_diagrams || null,
      warm: row.data.warm || {},
      blockStart: row.data.block_start || null,
      deloadInNumbers: !!row.data.deload_in_numbers,
      diagrams: row.data.diagrams || {}
    };
    render(cur);
  })
  .catch(function(err){
    showMessage("Can't reach the program", "Check the wifi. Retrying automatically in 60 seconds. (" + err.message + ")");
  });
}

load();
window.addEventListener("resize", fit);
window.addEventListener("load", fit);
// Once the real fonts are in, re-render so the picture size is chosen with true text metrics.
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(ME) render(cur); else fit(); });
if(document.fonts && document.fonts.addEventListener)
  document.fonts.addEventListener("loadingdone", function(){ if(ME) render(cur); });
setTimeout(fit, 400);
setTimeout(fit, 1500);
document.addEventListener("fullscreenchange", fit);

// Wake lock: while in fullscreen (session mode), tell the device the screen
// is actively in use so it doesn't dim or sleep. Released on exit.
// Fails silently if the browser doesn't support it.
var wakeLock = null;
function grabWakeLock(){
  if(!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").then(function(wl){
    wakeLock = wl;
  }).catch(function(){});
}
function dropWakeLock(){
  if(wakeLock){ wakeLock.release().catch(function(){}); wakeLock = null; }
}
document.addEventListener("fullscreenchange", function(){
  if(document.fullscreenElement) grabWakeLock();
  else dropWakeLock();
});
// The OS silently releases wake locks when a tab is hidden; re-grab on return.
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && document.fullscreenElement) grabWakeLock();
});

// Quiet refresh: re-fetch data every 60s without reloading the page,
// so fullscreen survives. Also rolls the display to the new day at midnight
// (only if you were viewing "today" — a day you navigated to stays put).
// Self-update: every 5 min, check whether a newer page build was deployed;
// if so, reload once. Ends all cache-clearing forever.
setInterval(function(){
  fetch(location.pathname + "?u=" + Date.now(), {cache:"no-store"})
    .then(function(r){ return r.text(); })
    .then(function(t){
      var m = t.match(/BUILD = "(\d+)"/);
      if(m && m[1] !== BUILD) location.reload();
    }).catch(function(){});
}, 300000);

// Tick just after each second boundary, so the seconds are true for tempos and intervals.
(function tick(){
  var el = document.getElementById("clock");
  if(el) el.innerHTML = clockHtml();
  setTimeout(tick, 1010 - new Date().getMilliseconds());
})();

var lastToday = new Date().getDay();
setInterval(function(){
  var t = new Date().getDay();
  if(t !== lastToday){
    if(cur === lastToday) cur = t;
    lastToday = t;
  }
  load();
}, 60000);

document.addEventListener("keydown", function(e){
  if(e.key==="ArrowRight"){ cur=(cur+1)%7; render(cur); }
  else if(e.key==="ArrowLeft"){ cur=(cur+6)%7; render(cur); }
  else if(e.key==="Home"){ cur=new Date().getDay(); render(cur); }
  else return;
  e.preventDefault();
});

document.getElementById("stage").addEventListener("click", function(e){
  var d = e.target.closest("[data-d]");
  if(d){
    if(d.dataset.d==="fs"){
      if(document.fullscreenElement){ document.exitFullscreen(); }
      else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
      return;
    }
    if(d.dataset.d==="next") cur=(cur+1)%7;
    else if(d.dataset.d==="prev") cur=(cur+6)%7;
    else cur=new Date().getDay();
    render(cur, '[data-d="'+d.dataset.d+'"]');
  }
});
</script>
</body>
